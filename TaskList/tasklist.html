<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task List</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <main class="container">
      <header>
        <h1>My Task List</h1>
      </header>
      <p
        class="sub-title"
        style="
          font-family: &quot;Playfair Display&quot;, serif;
          font-size: 0.85rem;
          color: #666161;
          text-align: center;
          margin-bottom: 1.8rem;
          letter-spacing: 0.02rem;
        "
      >
        Here are your tasks for the day!
      </p>
      <section class="task-list">
        <ul class="stats">
            <li class="stat">
                <div class="stat-label">Total</div>
                <div class="stat-value" id="total-tasks">0</div>
            </li>

            <li class="stat">
                <div class="stat-label">Pending</div>
                <div class="stat-value" id="pending-tasks">0</div>
            </li>

            <li class="stat">
                <div class="stat-label">Done</div>
                <div class="stat-value" id="done-tasks">0</div>
            </li>
        </ul>
      </section>

      <section class="input-row">
        <input 
        type="text"
        id="task-input"
        placeholder="Add your task here..."
        required
         />

         <button 
         class="add-btn"
         id="btn-add"
         style="background-color: burlywood; color: bisque;">Add Task</button>
      </section>

      <section class="filters">
        <button id="filterAll" class="filter-btn active" data-filter="all">All</button>
        <button id="filterPending" class="filter-btn" data-filter="pending">Pending</button>
        <button id="filterDone" class="filter-btn" data-filter="done">Done</button>
      </section>

      <section class="task-list" id="task-list">
        <p class="empty-msg">No tasks to display. Add one above!</p>
      </section>

      <section class="bottom-bar">
        <button id="clear-done">Clear done tasks.</button>
      </section>

    </main>
    <script src="./main.js"></script>
  </body>
</html>
